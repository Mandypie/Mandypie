<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients for wolf facets -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="darkFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="darkFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Neon Rings -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="16 12 40 8" opacity="0.8" filter="url(#glowCyan)" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#purpleGrad)" stroke-width="1.5" stroke-dasharray="8 18 30 10" opacity="0.5" />

  <!-- Geometric Polygonal Cyber Wolf Head -->
  <g id="wolf-head">
    <!-- Outer Ears (Left / Right) -->
    <polygon points="120,80 185,150 145,210" fill="url(#purpleGrad)" opacity="0.9" filter="url(#glowPurple)" />
    <polygon points="380,80 315,150 355,210" fill="url(#cyanGrad)" opacity="0.9" filter="url(#glowCyan)" />

    <!-- Inner Ears -->
    <polygon points="135,105 180,155 155,200" fill="#0f172a" />
    <polygon points="365,105 320,155 345,200" fill="#0f172a" />

    <!-- Crown & Forehead -->
    <polygon points="250,130 185,150 250,185" fill="url(#darkFacet1)" stroke="#38bdf8" stroke-width="1" />
    <polygon points="250,130 315,150 250,185" fill="url(#darkFacet2)" stroke="#818cf8" stroke-width="1" />

    <!-- Cheeks (Left / Right) -->
    <polygon points="185,150 120,240 180,245" fill="url(#darkFacet2)" stroke="#38bdf8" stroke-width="1" />
    <polygon points="315,150 380,240 320,245" fill="url(#darkFacet1)" stroke="#818cf8" stroke-width="1" />
    <polygon points="120,240 90,290 170,285" fill="url(#purpleGrad)" opacity="0.85" />
    <polygon points="380,240 410,290 330,285" fill="url(#cyanGrad)" opacity="0.85" />

    <!-- Mid Face -->
    <polygon points="250,185 185,150 180,245" fill="url(#darkFacet1)" stroke="#0ea5e9" stroke-width="1" />
    <polygon points="250,185 315,150 320,245" fill="url(#darkFacet2)" stroke="#6366f1" stroke-width="1" />
    <polygon points="250,185 180,245 250,270" fill="url(#darkFacet2)" stroke="#0284c7" stroke-width="1" />
    <polygon points="250,185 320,245 250,270" fill="url(#darkFacet1)" stroke="#4f46e5" stroke-width="1" />

    <!-- Neon Cyber Eyes -->
    <polygon points="190,225 235,235 195,245" fill="#00f5ff" filter="url(#glowCyan)" />
    <polygon points="310,225 265,235 305,245" fill="#a855f7" filter="url(#glowPurple)" />

    <!-- Bridge of Muzzle -->
    <polygon points="250,270 215,310 250,335" fill="url(#darkFacet1)" stroke="#38bdf8" stroke-width="1" />
    <polygon points="250,270 285,310 250,335" fill="url(#darkFacet2)" stroke="#818cf8" stroke-width="1" />
    <polygon points="180,245 215,310 170,285" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <polygon points="320,245 285,310 330,285" fill="#0f172a" stroke="#4f46e5" stroke-width="1" />

    <!-- Lower Cheeks / Jaw Wings -->
    <polygon points="170,285 215,310 180,365 140,345" fill="url(#darkFacet2)" stroke="#0369a1" stroke-width="1" />
    <polygon points="330,285 285,310 320,365 360,345" fill="url(#darkFacet1)" stroke="#4338ca" stroke-width="1" />

    <!-- Muzzle / Snout -->
    <polygon points="250,335 220,375 250,390" fill="url(#darkFacet2)" stroke="#38bdf8" stroke-width="1" />
    <polygon points="250,335 280,375 250,390" fill="url(#darkFacet1)" stroke="#818cf8" stroke-width="1" />
    <polygon points="215,310 220,375 250,335" fill="#0f172a" />
    <polygon points="285,310 280,375 250,335" fill="#0f172a" />

    <!-- Nose / Cyber Tip -->
    <polygon points="250,385 235,400 265,400" fill="#00f5ff" filter="url(#glowCyan)" />

    <!-- Chin -->
    <polygon points="250,390 230,425 270,425" fill="url(#cyanGrad)" opacity="0.9" filter="url(#glowCyan)" />
    <polygon points="220,375 230,425 180,365" fill="#090d16" stroke="#0284c7" stroke-width="0.7" />
    <polygon points="280,375 270,425 320,365" fill="#090d16" stroke="#6366f1" stroke-width="0.7" />
  </g>

  <!-- Tech Accent Lines & Nodes -->
  <line x1="250" y1="20" x2="250" y2="70" stroke="#00f5ff" stroke-width="2" filter="url(#glowCyan)" />
  <circle cx="250" cy="70" r="4" fill="#00f5ff" filter="url(#glowCyan)" />
  
  <line x1="50" y1="250" x2="100" y2="250" stroke="#a855f7" stroke-width="2" filter="url(#glowPurple)" />
  <circle cx="100" cy="250" r="4" fill="#a855f7" filter="url(#glowPurple)" />

  <line x1="450" y1="250" x2="400" y2="250" stroke="#00f5ff" stroke-width="2" filter="url(#glowCyan)" />
  <circle cx="400" cy="250" r="4" fill="#00f5ff" filter="url(#glowCyan)" />

  <!-- Subtitle Text -->
  <text x="250" y="465" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="6" fill="#94a3b8" text-anchor="middle" opacity="0.85">MICHAEL // TOXIC WOLF</text>
</svg>
